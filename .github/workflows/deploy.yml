# 자동 배포 — main push(또는 Actions 탭의 수동 버튼)마다:
#   도커 이미지 빌드 → ghcr.io 푸시 → VM에 ssh로 들어가 compose pull + up.
# 필요한 repo secrets: DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY (+ 선택 VITE_FIREBASE_* 4개).
# 주의: push마다 라이브 서버가 재시작되어 진행 중인 게임이 끊긴다 — 시연 중엔
# 아래 push 트리거를 지우고 workflow_dispatch만 남기면 수동 배포 전용이 된다.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :<sha> 태그는 롤백용 — VM compose의 태그를 바꿔 이전 버전으로 즉시 복귀 가능.
          tags: |
            ghcr.io/madcamp-official/best-project:latest
            ghcr.io/madcamp-official/best-project:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # GHCR가 private여도 pull되도록 워크플로의 임시 토큰으로 로그인(패키지 공개 설정 불필요).
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd ~/deploy
            docker compose pull
            docker compose up -d
            docker image prune -f
