# 자동 배포 — main push(또는 Actions 탭의 수동 버튼)마다 도커 이미지를 빌드해 ghcr.io로 푸시한다.
# 배포 자체는 pull 방식: kcloud VM은 외부에서 ssh가 안 되므로(내부망), VM의 watchtower가
# 30초마다 :latest 갱신을 감지해 자동으로 pull+재기동한다(deploy/docker-compose.yml).
# 별도 secrets 불필요 (구글 로그인 쓸 때만 VITE_FIREBASE_* 4개 선택 등록).
# 주의: push마다 라이브 서버가 재시작되어 진행 중인 게임이 끊긴다 — 시연 중엔
# 아래 push 트리거를 지우고 workflow_dispatch만 남기면 수동 배포 전용이 된다.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :<sha> 태그는 롤백용 — VM compose의 태그를 바꿔 이전 버전으로 즉시 복귀 가능.
          tags: |
            ghcr.io/madcamp-official/best-project:latest
            ghcr.io/madcamp-official/best-project:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
