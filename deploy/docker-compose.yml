# VM용 compose — 빌드 없이 GHCR 이미지를 pull해서 실행한다(빌드는 GitHub Actions가 담당).
# VM의 ~/deploy/docker-compose.yml 로 복사해 두고 최초 1회 `docker compose up -d` 하면,
# 이후에는 watchtower가 30초마다 GHCR의 :latest 갱신을 감지해 자동으로 pull+재기동한다
# (kcloud VM은 외부에서 ssh 불가라 push 배포 대신 pull 배포 — deploy.yml 참조).
#
# 준비물(1회):
#   mkdir -p ~/deploy/secrets
#   GHCR 패키지(best-project)를 Public으로 설정 — 아니면 docker login ghcr.io 필요
#   (선택) 구글 로그인 서버 검증: secrets/firebase-service-account.json 업로드
services:
  game:
    image: ghcr.io/madcamp-official/best-project:latest
    container_name: game # watchtower가 이 이름으로 감시 대상을 지정한다
    ports:
      - "3000:8080" # madcamp 터널이 city-master 도메인 → VM:3000(localPort)으로 매핑됨. TLS는 Cloudflare가 종단.
    environment:
      - REDIS_HOST=redis # 명예의 전당 랭킹(ZSET). redis 서비스가 죽어 있어도 게임은 정상(랭킹만 비활성).
      # 이 VM은 IPv6 아웃바운드가 완전히 막혀 있다(컨테이너에서 curl -6 → 응답 0바이트).
      # JVM이 IPv6를 먼저 잡으면 구글 공개키 인증서 수신이 빈 응답으로 깨져
      # ("Not in GZIP format") 구글 로그인 검증이 전부 401로 실패한다 → IPv4로 고정.
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
    volumes:
      - ./data:/app/data # H2 유저 DB 영속화 — 재배포에도 계정 유지
      - ./secrets:/app/secrets:ro # firebase-service-account.json (없어도 게스트 접속은 정상)
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: game-redis
    # AOF 영속화(재배포·재부팅에도 랭킹 유지) + 저사양 VM 보호용 메모리 상한.
    # noeviction: 랭킹 데이터가 조용히 증발하는 것보다 쓰기 실패(서버가 삼킴)가 낫다.
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - ./redis-data:/data
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR가 private라서 VM의 docker login(read:packages PAT) 인증을 watchtower의
      # 자동 pull에도 물려준다 — 이 마운트가 없으면 자동 업데이트만 unauthorized로 실패한다.
      - /root/.docker/config.json:/config.json:ro
    command: --interval 30 --cleanup game # game 컨테이너만 감시, 옛 이미지는 자동 정리
    restart: unless-stopped
