spring.application.name=server
server.port=8080
# plan.md Day5 — 클라 정적 빌드는 web/dist를 src/main/resources/static/ 로 복사해 넣는다.
# (단일 origin으로 서빙, CORS 회피)

# ── 구글 로그인(feat/google-login) ──────────────────────────────────────
# 유저 계정(AppUser) 전용 DB. 게임 월드(월드 스냅샷 JSON)와는 별개 — 로그인 계정만 담는다.
# 파일 기반 H2라 별도 DB 서버 설치가 필요 없다. server/data/는 이미 .gitignore 대상.
spring.datasource.url=jdbc:h2:file:./data/users;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Firebase 서비스 계정 키(JSON) 경로. Firebase 콘솔 > 프로젝트 설정 > 서비스 계정 >
# "새 비공개 키 생성"으로 발급받아 이 경로에 둔다(server/.gitignore의 /secrets/ 대상 — 절대 커밋 금지).
# 파일이 없으면 FirebaseAuthService가 구글 로그인만 비활성화하고(게스트 접속은 정상 동작) 서버는 그대로 뜬다.
app.firebase.service-account-path=secrets/firebase-service-account.json

